<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>Registration Form</h1>
        <form action="registrationForm" class="form">
            <label for="name">Name:</label><br>
            <input type="text" placeholder="Enter your name" id="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="text" id="email" placeholder="Enter your email"><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" placeholder="Enter password"><br><br>

            <label for="gender">Gender:</label><br>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female<br><br>

            <label for="hobbies">Hobbies:</label><br>
            <input type="checkbox">coding
            <input type="checkbox">Gaming
            <input type="checkbox">Reading<br><br>

            <label for="city">City:</label><br>
            <Select>
                <option value="hyderabad">Hyderabad</option>
                <option value="jaipur">Jaipur</option>
                <option value="pune">Pune</option>
            </Select><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message"></textarea><br><br>

            <button>Submit</button>
            <button>Reset</button>
        </form>
        
    </div>
</body>
</html>
