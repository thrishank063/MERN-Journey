<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="rockPaperScisssorsStyle.css">
</head>
<body>
    <div class="main-container">
        <h1>Rock - Paper - Scissors</h1>
        <div class="choices">
            <button onclick="playerChoice('rock')">👊</button>
            <button onclick="playerChoice('paper')">✋</button>
            <button onclick="playerChoice('scissors')">✌️</button>
        </div>
        <div id="playerOption">PLAYER :</div>
        <div id="computerOption">COMPUTER :</div>
        <div id="resultDisplay"></div>

        <div class="scoreDisplay">
            Player Score: <span id="playerScoreDisplay">0</span>
        </div>
        <div class="scoreDisplay">
            Computer Score: <span id="ComputerScoreDisplay">0</span>
        </div>
    </div>

    <script src="rockPaperScisssorsJS.js"></script>
</body>
</html>
